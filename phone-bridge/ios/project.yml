name: PhoneBridge
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  PhoneBridge:
    type: application
    platform: iOS
    sources: [Bridge]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phonebridge.ios
        MARKETING_VERSION: "0.5"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Bridge/Info.plist
      properties:
        CFBundleDisplayName: Ghafoorii
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Scan the pairing QR code shown on your Android phone.
        NSMicrophoneUsageDescription: Your voice is sent, encrypted, to the call on your Android phone.
        NSBluetoothAlwaysUsageDescription: Talk to your Android phone directly over Bluetooth when it is near, without the internet.
        UIBackgroundModes: [audio, bluetooth-central]
        # Touch and hold the app icon: open Messages, Keypad or Recents directly.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.phonebridge.messages
            UIApplicationShortcutItemTitle: Messages
            UIApplicationShortcutItemIconSymbolName: message
          - UIApplicationShortcutItemType: com.phonebridge.keypad
            UIApplicationShortcutItemTitle: Keypad
            UIApplicationShortcutItemIconSymbolName: circle.grid.3x3
          - UIApplicationShortcutItemType: com.phonebridge.recents
            UIApplicationShortcutItemTitle: Recents
            UIApplicationShortcutItemIconSymbolName: clock
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
